const stOf=(r,it)=>{const k=r.form+"|"+it.code;return r.items[k]||(r.items[k]={c:[],n:null,s:null,note:"",na:!!it.defNa})};

/* ===== TÍNH ĐIỂM ===== */
function auto(it,st){
  const sum=a=>a.reduce((t,w,i)=>t+(st.c[i]?w.w:0),0);
  if(it.kind==="sum")return Math.round(sum(it.subs)*2)/2;
  if(it.kind==="bins")return sum(it.subs)+Math.max(0,it.counter.max-(st.n||0));
  if(it.kind==="present"){const p=it.subs.filter((_,i)=>st.c[i]).length;return p>=it.subs.length?2:p>=it.t1?1:0}
  if(it.kind==="count"){if(st.n==null)return null;const c=it.counter;return st.n>=c.max?2:st.n>=c.t1?1:0}
  return null}
const score=(r,it)=>{const v=stOf(r,it).s;return v==null?0:v};
function totals(r){const f=FORMS[r.form];let t=0,done=0,mx=0,cnt=0;const secs=f.sections.map(()=>({s:0,m:0,d:0,n:0}));
  f.items.forEach(it=>{const st=stOf(r,it);if(st.na)return;const v=st.s==null?0:st.s;t+=v;mx+=it.max;cnt++;if(st.s!=null)done++;const o=secs[it.sec];o.s+=v;o.m+=it.max;o.n++;if(st.s!=null)o.d++});
  return{t,max:mx,done,n:cnt,secs,pct:mx?t/mx*100:0}}

/* ===== GIAO DIỆN ===== */
function badgeCls(v,m,answered){if(!answered)return"badge";return v>=m?"badge full":v<=0?"badge zero":"badge part"}
function itemCard(it,r){
  const st=stOf(r,it),ans=st.s!=null,v=ans?st.s:0,id=`it-${it.code.replace(".","_")}`;
  const naBox=it.optional?`<label class="sub" style="margin-top:10px"><input type="checkbox" data-a="na" ${st.na?"checked":""}><span>Không áp dụng cho đơn vị này (không tính điểm)</span></label>`:"";
  if(st.na)return `<section class="card" id="${id}" data-code="${it.code}" style="opacity:.8"><div class="item-h"><span class="code">${esc(it.code)}</span><h3>${esc(it.title)}</h3><span class="badge">N/A</span></div>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:""}${naBox}</section>`;
  let h=`<section class="card" id="${id}" data-code="${it.code}"><div class="item-h"><span class="code">${esc(it.code)}</span><h3>${esc(it.title)}</h3><span class="${badgeCls(v,it.max,ans)}">${ans?fmt(v):"–"}/${it.max}</span></div>`;
  if(it.hint)h+=`<p class="hint">${esc(it.hint)}</p>`;
  if(it.subs)h+=`<div class="subs">`+it.subs.map((s,i)=>`<label class="sub"><input type="checkbox" data-a="chk" data-i="${i}" ${st.c[i]?"checked":""}><span>${esc(s.t)}${s.w!==1?` <small>(${s.w}đ)</small>`:""}</span></label>`).join("")+`</div>`;
  if(it.counter){const n=st.n==null?(it.kind==="bins"?0:null):st.n;h+=`<div class="row"><span style="flex:1;min-width:140px;font-size:14px">${esc(it.counter.label)}</span><span class="step"><button data-a="cnt" data-d="-1" aria-label="Giảm">−</button><output>${n==null?"–":n}</output><button data-a="cnt" data-d="1" aria-label="Tăng">+</button></span></div>`}
  if(it.levels){
    h+=`<div class="lv" role="group" aria-label="Chọn điểm">`+it.levels.map(l=>`<button data-a="lv" data-s="${l.s}" aria-pressed="${st.s===l.s}">${l.s} đ</button>`).join("")+`</div>`;
    const cur=it.levels.find(l=>l.s===st.s);
    if(cur)h+=`<p class="lvtxt">${esc(cur.t)}</p>`;
    h+=`<details><summary>Xem tiêu chí chấm</summary><ul style="padding-left:18px;margin:4px 0">`+it.levels.map(l=>`<li><b>${l.s} điểm:</b> ${esc(l.t)}</li>`).join("")+`</ul></details>`;
  }else{
    h+=`<div class="row"><span style="flex:1;font-size:14px">Điểm đạt <small style="color:var(--mute)">(tự tính theo ô đã tick, có thể chỉnh)</small></span><span class="step"><button data-a="sc" data-d="-0.5" aria-label="Giảm điểm">−</button><output>${ans?fmt(v):"–"}</output><button data-a="sc" data-d="0.5" aria-label="Tăng điểm">+</button></span></div>`;
  }
  h+=naBox+`<textarea class="note" data-a="note" rows="1" placeholder="Ghi chú / tồn tại phát hiện…">${esc(st.note)}</textarea></section>`;
  return h}

function lossList(r,f){return f.items.filter(it=>{const st=stOf(r,it);return !st.na&&(st.s==null||st.s<it.max)})}
/* Chi tiết điểm bị trừ: số điểm mất + lý do (ý chưa đạt, số thùng sai, mức chấm) */
function lossInfo(r,it){const st=stOf(r,it),lost=it.max-(st.s==null?0:st.s),why=[];
  if(st.s==null){why.push("Chưa chấm điểm")}
  else{
    if(it.subs){const miss=it.subs.filter((_,i)=>!st.c[i]);if(miss.length&&it.kind!=="manual")why.push("Chưa đạt: "+miss.map(m=>m.t).join("; "))}

    sec.items.forEach(it=>{const st=stOf(r,it);if(st.na)return;let c=para(it.title,{b:1});
      if(it.subs)it.subs.forEach((s,k)=>c+=para((st.c[k]?"☑ ":"☐ ")+s.t));
      if(it.kind==="bins"&&st.n!=null)c+=para(`Số thùng phân loại sai: ${st.n}/5`);
      if(it.kind==="count"&&st.n!=null)c+=para(`${it.counter.label}: ${st.n}`);
      if(it.levels){const l=it.levels.find(x=>x.s===st.s);if(l)c+=para(`Mức ${l.s} điểm: ${l.t}`,{i:1})}
      tb+=row(cell(W[0],para(it.code,{jc:"center"}))+cell(W[1],c)+cell(W[2],para(String(it.max),{jc:"center"}))+cell(W[3],para(st.s==null?"":fmt(st.s),{jc:"center"}))+cell(W[4],para(st.note||"")))})});
  tb+=row(cell(W[0],para(""),{fill:"E8E8E8"})+cell(W[1],para(`Tổng điểm (${fmt(t.pct)}%)`,{b:1}),{fill:"E8E8E8"})+cell(W[2],para(fmt(t.max),{b:1,jc:"center"}),{fill:"E8E8E8"})+cell(W[3],para(fmt(t.t),{b:1,jc:"center"}),{fill:"E8E8E8"})+cell(W[4],para("Điểm bị trừ: "+fmt(t.max-t.t)),{fill:"E8E8E8"}));
  b+=`<w:tbl><w:tblPr><w:tblW w:w="9900" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${tb}</w:tbl>`;
  b+=para("");
  b+=para("Nhận xét và kết luận của cán bộ kiểm tra:",{b:1})+para(r.nx||"........................................................................");
  b+=para("Đề nghị của đơn vị:",{b:1})+para(r.dn||"........................................................................");
  b+=para("");
  const S=[4950,4950];
  const pic=(rid,n)=>`<w:p><w:pPr><w:spacing w:before="60" w:after="60"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="1800000" cy="720000"/><wp:docPr id="${n}" name="Chu ky ${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="sig${n}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="1800000" cy="720000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  const sg=(title,sig,rid,n,name)=>para(title,{b:1,jc:"center"})+para("(Ký, ghi rõ họ tên)",{i:1,jc:"center",sz:20})+(sig?pic(rid,n):para("\n\n"))+para(name||"",{jc:"center",b:1});
  b+=`<w:tbl><w:tblPr><w:tblW w:w="9900" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="4950"/><w:gridCol w:w="4950"/></w:tblGrid>${row(cell(S[0],sg("Xác nhận của đơn vị",r.sigUnit,"rIdS1",1,r.unitSigner))+cell(S[1],sg("TM. Đoàn kiểm tra",r.sigInsp,"rIdS2",2,r.inspector)))}</w:tbl>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="1130" w:header="425" w:footer="425" w:gutter="0"/></w:sectPr></w:body></w:document>`}
const sigBytes=u=>Uint8Array.from(atob(u.split(",")[1]),c=>c.charCodeAt(0));
const relsXml=r=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${r.sigUnit?'<Relationship Id="rIdS1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/sig1.png"/>':""}${r.sigInsp?'<Relationship Id="rIdS2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/sig2.png"/>':""}</Relationships>`;
const mediaFiles=r=>[r.sigUnit&&{name:"word/media/sig1.png",data:sigBytes(r.sigUnit)},r.sigInsp&&{name:"word/media/sig2.png",data:sigBytes(r.sigInsp)}].filter(Boolean);
async function exportWord(r){
  const slug=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const name=`Phieu-KSNK_${slug(r.unit)||"don-vi"}_${r.date||""}.docx`;
  let blob;try{blob=makeZip([
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
    {name:"word/document.xml",data:docxXml(r)},{name:"word/_rels/document.xml.rels",data:relsXml(r)},...mediaFiles(r)])}catch(e){toast("Không tạo được file Word");return false}
  try{const c=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(c){await c.save({filename:name,data:blob});toast("Đã lưu "+name);return true}}
  catch(e){if(e&&e.code==="declined")return false;}
  try{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Đã tạo "+name+". Không thấy file thì dùng nút Sao chép dán vào Word");return true}
  catch(e){toast("Không tải được, hãy dùng nút Sao chép dán vào Word");return false}}
async function doWord(){const r=cr();const ok=await exportWord(r);if(!ok||ST.view==="hist")return;
  if(signMissing(r).length)toast("Đã xuất bản nháp. Chưa đủ chữ ký/họ tên nên chưa lưu vào lịch sử");
  else{addHist(r);toast("Đã xuất Word và lưu vào lịch sử")}}
function exportWordOld(r){
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Phiếu kiểm tra KSNK</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page{size:21cm 29.7cm;margin:1.5cm 1.5cm 1.5cm 2cm}body{font-family:"Times New Roman",serif;font-size:12pt}table{border-collapse:collapse}td,th{font-size:11pt}</style></head><body>${docBody(r)}</body></html>`;
  const slug=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const name=`Phieu-KSNK_${slug(r.unit)||"don-vi"}_${r.date||""}.doc`;
  try{const url=URL.createObjectURL(new Blob(["﻿"+html],{type:"application/msword"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Đã tạo "+name+". Không thấy file tải về thì dùng nút Sao chép dán vào Word")}
  catch(e){toast("Không tải được, hãy dùng nút Sao chép dán vào Word")}}
function copyWordHtml(r){const html=docBody(r),txt=reportText(r);
  const fb=()=>copy(txt,"Đã sao chép dạng văn bản");
  try{navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]).then(()=>toast("Đã sao chép phiếu, mở Word và dán (Ctrl+V)"),fb)}catch(e){fb()}}
function reportTSV(r){const f=FORMS[r.form];let s="TT\tNội dung\tĐiểm chuẩn\tĐiểm đạt\tGhi chú\n";
  f.sections.forEach(sec=>sec.items.forEach(it=>{const st=stOf(r,it);if(st.na)return;s+=`${it.code}\t${it.title}\t${it.max}\t${st.s==null?"":st.s}\t${(st.note||"").replace(/\s+/g," ")}\n`}));
  const t=totals(r);return s+`\tTổng điểm\t${t.max}\t${t.t}\t`}
function summaryTSV(){let s="Đơn vị\tBiểu mẫu\tNgày\tNgười kiểm tra\tĐiểm đạt\tĐiểm chuẩn\t%\tĐã chấm\n";
  ST.recs.slice().reverse().forEach(r=>{const t=totals(r);s+=[r.unit,FORMS[r.form].short,vdate(r.date),r.inspector,t.t,t.max,Math.round(t.pct*10)/10,t.done+"/"+t.n].join("\t")+"\n"});return s}

/* ===== TIỆN ÍCH ===== */
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2200)}
function copy(text,msg){
  const fb=()=>{const a=document.createElement("textarea");a.value=text;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?msg:"Không sao chép được, hãy chụp màn hình")};
  try{navigator.clipboard.writeText(text).then(()=>toast(msg),fb)}catch(e){fb()}}
function refreshItem(code){const r=rec(),it=form().items.find(i=>i.code===code),el=document.getElementById("it-"+code.replace(".","_"));if(el){el.outerHTML=itemCard(it,r)}refreshTop()}
function refreshTop(){const r=rec(),t=totals(r);const p=document.querySelector(".top .pill");if(p)p.textContent=fmt(t.t)+"/"+fmt(t.max);
  document.querySelectorAll(".chip").forEach(c=>{const k=c.dataset.t;if(/^\d+$/.test(k)){const o=t.secs[+k];c.querySelector("small").textContent=`${o.d}/${o.n}`}})}
function render(){$("#app").innerHTML=ST.view==="home"?homeView():ST.view==="hist"?histView():checkView();
  if(ST.view==="check"&&ST.tab==="result"){initPads();updSignState()}}

/* ===== SỰ KIỆN ===== */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="new")return newRec(b.dataset.f);
  if(a==="open"){ST.cur=b.dataset.id;ST.tab="info";ST.view="check";ST.delId=null;render();window.scrollTo(0,0);return}
  if(a==="del"){if(ST.delId===b.dataset.id){ST.recs=ST.recs.filter(r=>r.id!==b.dataset.id);ST.delId=null;save()}else ST.delId=b.dataset.id;render();return}
  if(a==="sum")return copy(summaryTSV(),"Đã sao chép bảng tổng hợp");
  if(a==="home"){ST.view="home";ST.delId=null;render();window.scrollTo(0,0);return}
  if(a==="tab"){ST.tab=b.dataset.t;render();window.scrollTo(0,0);return}
  if(a==="go"){const f=form(),o=["info",...f.sections.map((_,i)=>String(i)),"result"];ST.tab=o[o.indexOf(ST.tab)+ +b.dataset.d];render();window.scrollTo(0,0);return}
  if(a==="nx"){const r=rec(),g=autoNx(r);r.nx=(!r.nx||r.nx.startsWith("Kết quả kiểm tra"))?g:r.nx+"\n\n"+g;save();render();toast("Đã đưa kết quả vào phần nhận xét");return}
  if(a==="word")return doWord();
  if(a==="copyword")return copyWordHtml(cr());
  if(a==="copy")return copy(reportText(cr()),"Đã sao chép báo cáo");
  if(a==="copytsv")return copy(reportTSV(cr()),"Đã sao chép bảng điểm");
  if(a==="sigclear"){const r=rec(),k=b.dataset.key;r[k]="";r.upd=Date.now();save();render();return}
  if(a==="hopen"){const x=ST.hist.find(y=>y.id===b.dataset.id);if(x){ST.h=x.snap;ST.hts=x.ts;ST.view="hist";render();window.scrollTo(0,0)}return}
  if(a==="hdel"){if(ST.delH===b.dataset.id){ST.hist=ST.hist.filter(y=>y.id!==b.dataset.id);ST.delH=null;saveH()}else ST.delH=b.dataset.id;render();return}
  const card=b.closest("[data-code]");if(!card)return;
  const r=rec(),it=form().items.find(i=>i.code===card.dataset.code),st=stOf(r,it);
  if(a==="cnt"){const c=it.counter,cur=st.n==null?(it.kind==="bins"?0:Math.min(c.max,0)):st.n;st.n=Math.max(0,Math.min(c.max,cur+ +b.dataset.d));const v=auto(it,st);if(v!=null)st.s=v}
  else if(a==="lv"){st.s=+b.dataset.s}
  else if(a==="sc"){const cur=st.s==null?0:st.s;st.s=Math.max(0,Math.min(it.max,cur+ +b.dataset.d))}
  else return;
  r.upd=Date.now();save();refreshItem(it.code)});
document.addEventListener("change",e=>{
  const x=e.target,a=x.dataset&&x.dataset.a;if(!a)return;
  if(a==="na"){const card=x.closest("[data-code]"),r=rec(),it=form().items.find(i=>i.code===card.dataset.code),st=stOf(r,it);st.na=x.checked;
    /* 1.5 và 1.6 là hai trường hợp loại trừ nhau: bật mục này thì tắt mục kia */
    const pair=r.form==="bm02b"&&(it.code==="1.5"?"1.6":it.code==="1.6"?"1.5":null);
    if(pair&&!st.na){const o=form().items.find(i=>i.code===pair);stOf(r,o).na=true;refreshItem(pair)}
    r.upd=Date.now();save();refreshItem(it.code);return}
  if(a==="chk"){const card=x.closest("[data-code]"),r=rec(),it=form().items.find(i=>i.code===card.dataset.code),st=stOf(r,it);
    st.c[+x.dataset.i]=x.checked;
    for(let i=0;i<it.subs.length;i++)st.c[i]=!!st.c[i];
    const v=auto(it,st);if(v!=null)st.s=v;r.upd=Date.now();save();refreshItem(it.code)}
});
document.addEventListener("input",e=>{
  const x=e.target,a=x.dataset&&x.dataset.a;if(!a)return;
  if(a==="fld"){const r=rec();r[x.dataset.k]=x.value;r.upd=Date.now();save();updSignState();if(x.dataset.k==="unit"){const h=document.querySelector(".top h1");if(h)h.textContent=x.value||form().short}}
  if(a==="note"){const r=rec(),it=form().items.find(i=>i.code===x.closest("[data-code]").dataset.code);stOf(r,it).note=x.value;save()}
});
render();
</script>
</body></html>
